<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="socialGlowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFDD00"/>
      <stop offset="25%" stop-color="#FF3E00"/>
      <stop offset="60%" stop-color="#D6008D"/>
      <stop offset="100%" stop-color="#6B00D7"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Main Outer Rounded Rectangle -->
  <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#socialGlowGrad)" />
  <!-- Inner White Border Line -->
  <rect x="15" y="15" width="70" height="70" rx="20" fill="none" stroke="#FFFFFF" stroke-width="5.5" opacity="0.95" />
  <!-- Top Right Small White Dot -->
  <circle cx="70" cy="27" r="4.5" fill="#FFFFFF" />
  <!-- Center Glowing 4-Point Sparkle Star -->
  <path d="M 50 28 C 50 40, 40 50, 28 50 C 40 50, 50 60, 50 72 C 50 60, 60 50, 72 50 C 60 50, 50 40, 50 28 Z" fill="#FFFFFF" filter="url(#softGlow)" />
  <!-- Small Ambient Sparkle Dots -->
  <circle cx="36" cy="38" r="1.8" fill="#FFFFFF" opacity="0.9" />
  <circle cx="63" cy="36" r="1.5" fill="#FFFFFF" opacity="0.9" />
  <circle cx="37" cy="62" r="1.8" fill="#FFFFFF" opacity="0.9" />
</svg>
